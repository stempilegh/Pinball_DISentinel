<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GI Sentinel – Data East Edition</title>
  <link rel="stylesheet" href="dataeast.css">
</head>

<body>
  <h1>GI Sentinel – Data East Edition</h1>

  <button id="connectButton">Connect</button>
  <span id="status">Status: Not connected</span>

  <h2>Game Name</h2>
  <input type="text" id="gameName" placeholder="Enter game name">
  <button id="saveNameButton">Save Name</button>

  <h2>System</h2>
  <button id="restartButton">Restart ESP32</button>

  <h2>Configuration</h2>

  <!-- ✅ Wrap all channels inside this grid container -->
  <div class="channel-grid">

    <div class="channel-box">
      <h3>Channel 1</h3>
      Min: <input type="range" id="min1" min="0" max="255"> <span id="min1v"></span><br>
      Max: <input type="range" id="max1" min="0" max="255"> <span id="max1v"></span><br>
      Fade: <input type="range" id="fade1" min="1" max="20"> <span id="fade1v"></span><br>
      Down Delay: <input type="range" id="dd1" min="0" max="20"> <span id="dd1v"></span><br>
      Up Delay: <input type="range" id="du1" min="0" max="20"> <span id="du1v"></span>
    </div>

    <div class="channel-box">
      <h3>Channel 2</h3>
      Min: <input type="range" id="min2" min="0" max="255"> <span id="min2v"></span><br>
      Max: <input type="range" id="max2" min="0" max="255"> <span id="max2v"></span><br>
      Fade: <input type="range" id="fade2" min="1" max="20"> <span id="fade2v"></span><br>
      Down Delay: <input type="range" id="dd2" min="0" max="20"> <span id="dd2v"></span><br>
      Up Delay: <input type="range" id="du2" min="0" max="20"> <span id="du2v"></span>
    </div>

    <div class="channel-box">
      <h3>Channel 3</h3>
      Min: <input type="range" id="min3" min="0" max="255"> <span id="min3v"></span><br>
      Max: <input type="range" id="max3" min="0" max="255"> <span id="max3v"></span><br>
      Fade: <input type="range" id="fade3" min="1" max="20"> <span id="fade3v"></span><br>
      Down Delay: <input type="range" id="dd3" min="0" max="20"> <span id="dd3v"></span><br>
      Up Delay: <input type="range" id="du3" min="0" max="20"> <span id="du3v"></span>
    </div>

    <div class="channel-box">
      <h3>Channel 4</h3>
      Min: <input type="range" id="min4" min="0" max="255"> <span id="min4v"></span><br>
      Max: <input type="range" id="max4" min="0" max="255"> <span id="max4v"></span><br>
      Fade: <input type="range" id="fade4" min="1" max="20"> <span id="fade4v"></span><br>
      Down Delay: <input type="range" id="dd4" min="0" max="20"> <span id="dd4v"></span><br>
      Up Delay: <input type="range" id="du4" min="0" max="20"> <span id="du4v"></span>
    </div>

  </div>

  <button id="saveConfigButton">Save All</button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GI Sentinel – Data East Edition</title>
  <link rel="stylesheet" href="layout.css">
</head>

<body>
  <div class="dashboard">

    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <h1>GI Sentinel</h1>
        <button id="connectButton">Connect</button>
        <span id="status">Status: Not connected</span>
        <p class="brand">StempleLABS ©2026</p>
      </div>

      <div class="header-right">
        <label for="gameName">Game Name</label>
        <input type="text" id="gameName" placeholder="Enter game name">
        <button id="saveNameButton">Save</button>
        <label>System</label>
        <button id="restartButton">Restart</button>
      </div>
    </div>

    <!-- GAUGE ROW -->
    <div class="gauge-row">
      <button id="testButton">Test</button>
      <div class="gauge"><span id="b1">CH1%</span></div>
      <div class="gauge"><span id="b2">CH2%</span></div>
      <div class="gauge"><span id="b3">CH3%</span></div>
      <div class="gauge"><span id="b4">CH4%</span></div>
    </div>

    <!-- CHANNEL GRID -->
    <div class="channel-grid">

      <div class="channel-box">
        <h3>Channel 1</h3>
        Min: <input type="range" id="min1" min="0" max="255"><br>
        Max: <input type="range" id="max1" min="0" max="255"><br>
        Fade: <input type="range" id="fade1" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd1" min="0" max="20"><br>
        Up Delay: <input type="range" id="du1" min="0" max="20">
      </div>

      <div class="channel-box">
        <h3>Channel 2</h3>
        Min: <input type="range" id="min2" min="0" max="255"><br>
        Max: <input type="range" id="max2" min="0" max="255"><br>
        Fade: <input type="range" id="fade2" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd2" min="0" max="20"><br>
        Up Delay: <input type="range" id="du2" min="0" max="20">
      </div>

      <div class="channel-box">
        <h3>Channel 3</h3>
        Min: <input type="range" id="min3" min="0" max="255"><br>
        Max: <input type="range" id="max3" min="0" max="255"><br>
        Fade: <input type="range" id="fade3" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd3" min="0" max="20"><br>
        Up Delay: <input type="range" id="du3" min="0" max="20">
      </div>

      <div class="channel-box">
        <h3>Channel 4</h3>
        Min: <input type="range" id="min4" min="0" max="255"><br>
        Max: <input type="range" id="max4" min="0" max="255"><br>
        Fade: <input type="range" id="fade4" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd4" min="0" max="20"><br>
        Up Delay: <input type="range" id="du4" min="0" max="20">
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      <button id="saveConfigButton">Save All</button>
    </div>

  </div>

<!-- ⭐ FULL BLE SCRIPT (WORKING) -->
<script>
const SERVICE_UUID               = "19b10000-e8f2-537e-4f6c-d104768a1214";
const SENSOR_CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
const CONFIG_CHARACTERISTIC_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";
const SYNC_CHARACTERISTIC_UUID   = "19b10003-e8f2-537e-4f6c-d104768a1214";
const NAME_CHARACTERISTIC_UUID   = "19b10004-e8f2-537e-4f6c-d104768a1214";
const RESTART_CHARACTERISTIC_UUID = "19b10005-e8f2-537e-4f6c-d104768a1214";

let device = null;
let sensorCharacteristic = null;
let configCharacteristic = null;
let syncCharacteristic   = null;
let nameCharacteristic   = null;
let restartCharacteristic = null;

function fmtDelay(v) { return (v/10).toFixed(1) + " s"; }

function bindSlider(slider, label, formatter) {
  slider.addEventListener("input", () => label.innerHTML = formatter(slider.value));
}

bindSlider(min1, min1.nextElementSibling, v=>v);
bindSlider(max1, max1.nextElementSibling, v=>v);
bindSlider(fade1, fade1.nextElementSibling, v=>v);
bindSlider(dd1, dd1.nextElementSibling, fmtDelay);
bindSlider(du1, du1.nextElementSibling, fmtDelay);

bindSlider(min2, min2.nextElementSibling, v=>v);
bindSlider(max2, max2.nextElementSibling, v=>v);
bindSlider(fade2, fade2.nextElementSibling, v=>v);
bindSlider(dd2, dd2.nextElementSibling, fmtDelay);
bindSlider(du2, du2.nextElementSibling, fmtDelay);

bindSlider(min3, min3.nextElementSibling, v=>v);
bindSlider(max3, max3.nextElementSibling, v=>v);
bindSlider(fade3, fade3.nextElementSibling, v=>v);
bindSlider(dd3, dd3.nextElementSibling, fmtDelay);
bindSlider(du3, du3.nextElementSibling, fmtDelay);

bindSlider(min4, min4.nextElementSibling, v=>v);
bindSlider(max4, max4.nextElementSibling, v=>v);
bindSlider(fade4, fade4.nextElementSibling, v=>v);
bindSlider(dd4, dd4.nextElementSibling, fmtDelay);
bindSlider(du4, du4.nextElementSibling, fmtDelay);

connectButton.onclick = async () => {
  try {
    status.innerHTML = "Status: Requesting device...";

    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "GI-Sentinel" }],
      optionalServices: [SERVICE_UUID]
    });

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    sensorCharacteristic  = await service.getCharacteristic(SENSOR_CHARACTERISTIC_UUID);
    configCharacteristic  = await service.getCharacteristic(CONFIG_CHARACTERISTIC_UUID);
    syncCharacteristic    = await service.getCharacteristic(SYNC_CHARACTERISTIC_UUID);
    nameCharacteristic    = await service.getCharacteristic(NAME_CHARACTERISTIC_UUID);
    restartCharacteristic = await service.getCharacteristic(RESTART_CHARACTERISTIC_UUID);

    const syncData = await syncCharacteristic.readValue();
    const arr = new Uint8Array(syncData.buffer);

    function loadChannel(i, min, max, fade, dd, du) {
      min.value  = arr[i*5 + 0];
      max.value  = arr[i*5 + 1];
      fade.value = arr[i*5 + 2];
      dd.value   = arr[i*5 + 3];
      du.value   = arr[i*5 + 4];

      min.nextElementSibling.innerHTML  = min.value;
      max.nextElementSibling.innerHTML  = max.value;
      fade.nextElementSibling.innerHTML = fade.value;
      dd.nextElementSibling.innerHTML   = fmtDelay(dd.value);
      du.nextElementSibling.innerHTML   = fmtDelay(du.value);
    }

    loadChannel(0, min1, max1, fade1, dd1, du1);
    loadChannel(1, min2, max2, fade2, dd2, du2);
    loadChannel(2, min3, max3, fade3, dd3, du3);
    loadChannel(3, min4, max4, fade4, dd4, du4);

    const nameData = await nameCharacteristic.readValue();
    gameName.value = new TextDecoder().decode(nameData);

    await sensorCharacteristic.startNotifications();
    sensorCharacteristic.addEventListener("characteristicvaluechanged", event => {
      let txt = new TextDecoder().decode(event.target.value);
      let parts = txt.split(",");
      if (parts.length >= 4) {
        b1.innerHTML = parts[0];
        b2.innerHTML = parts[1];
        b3.innerHTML = parts[2];
        b4.innerHTML = parts[3];
      }
    });

    status.innerHTML = "Status: Connected";

  } catch (e) {
    console.error(e);
    status.innerHTML = "Status: Error connecting";
  }
};

saveConfigButton.onclick = async () => {
  if (!configCharacteristic) {
    alert("Not connected to ESP32");
    return;
  }

  const data = new Uint8Array(20);

  function saveChannel(i, min, max, fade, dd, du) {
    const base = i*5;
    data[base + 0] = parseInt(min.value);
    data[base + 1] = parseInt(max.value);
    data[base + 2] = parseInt(fade.value);
    data[base + 3] = parseInt(dd.value);
    data[base + 4] = parseInt(du.value);
  }

  saveChannel(0, min1, max1, fade1, dd1, du1);
  saveChannel(1, min2, max2, fade2, dd2, du2);
  saveChannel(2, min3, max3, fade3, dd3, du3);
  saveChannel(3, min4, max4, fade4, dd4, du4);

  try {
    await configCharacteristic.writeValue(data.buffer);
  } catch (e) {
    console.error("Error writing config:", e);
  }
};

saveNameButton.onclick = async () => {
  if (!nameCharacteristic) {
    alert("Not connected to ESP32");
    return;
  }

  try {
    await nameCharacteristic.writeValue(new TextEncoder().encode(gameName.value));
    alert("Game name saved. Restart ESP32 to update BLE name.");
  } catch (e) {
    console.error("Error writing name:", e);
  }
};

restartButton.onclick = async () => {
  if (!restartCharacteristic) {
    alert("Not connected to ESP32");
    return;
  }

  try {
    await restartCharacteristic.writeValue(new Uint8Array([1]));
    setTimeout(() => location.reload(), 150);
  } catch (e) {
    console.error("Restart failed:", e);
  }
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GI Sentinel – Data East Edition</title>
  <link rel="stylesheet" href="layout.css">
</head>

<body>
  <div class="dashboard">

    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <h1>GI Sentinel</h1>
        <button id="connectButton">Connect</button>
        <span id="status">Status: Not connected</span>
        <p class="brand">StempleLABS ©2026</p>
      </div>

      <div class="header-right">
        <label for="gameName">Game Name</label>
        <input type="text" id="gameName" placeholder="Enter game name">
        <button id="saveNameButton">Save</button>
        <label>System</label>
        <button id="restartButton">Restart</button>
      </div>
    </div>

    <!-- GAUGE ROW -->
    <div class="gauge-row">
      <button id="testButton">Test</button>
      <div class="gauge"><span>CH1%</span></div>
      <div class="gauge"><span>CH2%</span></div>
      <div class="gauge"><span>CH3%</span></div>
      <div class="gauge"><span>CH4%</span></div>
    </div>

    <!-- CHANNEL GRID -->
    <div class="channel-grid">
      <div class="channel-box">
        <h3>Channel 1</h3>
        Min: <input type="range" id="min1" min="0" max="255"><br>
        Max: <input type="range" id="max1" min="0" max="255"><br>
        Fade: <input type="range" id="fade1" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd1" min="0" max="20"><br>
        Up Delay: <input type="range" id="du1" min="0" max="20">
      </div>

      <div class="channel-box">
        <h3>Channel 2</h3>
        Min: <input type="range" id="min2" min="0" max="255"><br>
        Max: <input type="range" id="max2" min="0" max="255"><br>
        Fade: <input type="range" id="fade2" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd2" min="0" max="20"><br>
        Up Delay: <input type="range" id="du2" min="0" max="20">
      </div>

      <div class="channel-box">
        <h3>Channel 3</h3>
        Min: <input type="range" id="min3" min="0" max="255"><br>
        Max: <input type="range" id="max3" min="0" max="255"><br>
        Fade: <input type="range" id="fade3" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd3" min="0" max="20"><br>
        Up Delay: <input type="range" id="du3" min="0" max="20">
      </div>

      <div class="channel-box">
        <h3>Channel 4</h3>
        Min: <input type="range" id="min4" min="0" max="255"><br>
        Max: <input type="range" id="max4" min="0" max="255"><br>
        Fade: <input type="range" id="fade4" min="1" max="20"><br>
        Down Delay: <input type="range" id="dd4" min="0" max="20"><br>
        Up Delay: <input type="range" id="du4" min="0" max="20">
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <button id="saveConfigButton">Save All</button>
    </div>

  </div>
</body>
</html>

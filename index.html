<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ESP32 4‑Channel BLE Dashboard</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    input[type=range] { width: 300px; }
    h3 { margin-bottom: 5px; }
    .channel { margin-bottom: 15px; }
  </style>
</head>

<body>
  <h1>ESP32 4‑Channel BLE Dashboard 9:41pm</h1>

  <button id="connectButton">Connect</button>
  <p id="status">Status: Not connected</p>

  <h2>Current Brightness</h2>
  <p>CH1: <span id="b1">---</span></p>
  <p>CH2: <span id="b2">---</span></p>
  <p>CH3: <span id="b3">---</span></p>
  <p>CH4: <span id="b4">---</span></p>

  <h2>Configuration</h2>

  <div class="channel">
    <h3>Channel 1</h3>
    Min:
    <input type="range" id="min1" min="0" max="255" value="0">
    <span id="min1v">0</span><br>
    Max:
    <input type="range" id="max1" min="0" max="255" value="255">
    <span id="max1v">255</span>
  </div>

  <div class="channel">
    <h3>Channel 2</h3>
    Min:
    <input type="range" id="min2" min="0" max="255" value="0">
    <span id="min2v">0</span><br>
    Max:
    <input type="range" id="max2" min="0" max="255" value="255">
    <span id="max2v">255</span>
  </div>

  <div class="channel">
    <h3>Channel 3</h3>
    Min:
    <input type="range" id="min3" min="0" max="255" value="0">
    <span id="min3v">0</span><br>
    Max:
    <input type="range" id="max3" min="0" max="255" value="255">
    <span id="max3v">255</span>
  </div>

  <div class="channel">
    <h3>Channel 4</h3>
    Min:
    <input type="range" id="min4" min="0" max="255" value="0">
    <span id="min4v">0</span><br>
    Max:
    <input type="range" id="max4" min="0" max="255" value="255">
    <span id="max4v">255</span>
  </div>

  <button id="saveConfigButton">Save All</button>

<script>
const SERVICE_UUID               = "19b10000-e8f2-537e-4f6c-d104768a1214";
const SENSOR_CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
const CONFIG_CHARACTERISTIC_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";

let sensorCharacteristic = null;
let configCharacteristic = null;

// Slider label updates
const min1  = document.getElementById("min1");
const max1  = document.getElementById("max1");
const min2  = document.getElementById("min2");
const max2  = document.getElementById("max2");
const min3  = document.getElementById("min3");
const max3  = document.getElementById("max3");
const min4  = document.getElementById("min4");
const max4  = document.getElementById("max4");

const min1v = document.getElementById("min1v");
const max1v = document.getElementById("max1v");
const min2v = document.getElementById("min2v");
const max2v = document.getElementById("max2v");
const min3v = document.getElementById("min3v");
const max3v = document.getElementById("max3v");
const min4v = document.getElementById("min4v");
const max4v = document.getElementById("max4v");

min1.addEventListener("input", () => min1v.innerHTML = min1.value);
max1.addEventListener("input", () => max1v.innerHTML = max1.value);
min2.addEventListener("input", () => min2v.innerHTML = min2.value);
max2.addEventListener("input", () => max2v.innerHTML = max2.value);
min3.addEventListener("input", () => min3v.innerHTML = min3.value);
max3.addEventListener("input", () => max3v.innerHTML = max3.value);
min4.addEventListener("input", () => min4v.innerHTML = min4.value);
max4.addEventListener("input", () => max4v.innerHTML = max4.value);

// Connect to ESP32
document.getElementById("connectButton").onclick = async () => {
  try {
    document.getElementById("status").innerHTML = "Status: Requesting device...";

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ESP32" }],
      optionalServices: [SERVICE_UUID]
    });

    document.getElementById("status").innerHTML = "Status: Connecting...";

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    sensorCharacteristic = await service.getCharacteristic(SENSOR_CHARACTERISTIC_UUID);
    configCharacteristic = await service.getCharacteristic(CONFIG_CHARACTERISTIC_UUID);

    // Subscribe to brightness notifications
    await sensorCharacteristic.startNotifications();
    sensorCharacteristic.addEventListener("characteristicvaluechanged", event => {
      let txt   = new TextDecoder().decode(event.target.value);
      let parts = txt.split(",");
      if (parts.length >= 4) {
        document.getElementById("b1").innerHTML = parts[0];
        document.getElementById("b2").innerHTML = parts[1];
        document.getElementById("b3").innerHTML = parts[2];
        document.getElementById("b4").innerHTML = parts[3];
      }
    });

    document.getElementById("status").innerHTML = "Status: Connected";
  } catch (e) {
    console.error(e);
    document.getElementById("status").innerHTML = "Status: Error connecting";
  }
};

// Send min/max for all 4 channels
document.getElementById("saveConfigButton").onclick = async () => {
  if (!configCharacteristic) {
    alert("Not connected to ESP32");
    return;
  }

  const mins = [
    parseInt(min1.value), parseInt(min2.value),
    parseInt(min3.value), parseInt(min4.value)
  ];

  const maxs = [
    parseInt(max1.value), parseInt(max2.value),
    parseInt(max3.value), parseInt(max4.value)
  ];

  // Basic sanity: max >= min per channel
  for (let i = 0; i < 4; i++) {
    if (maxs[i] < mins[i]) {
      alert(`Channel ${i+1}: Max must be >= Min`);
      return;
    }
  }

  const data = new Uint8Array(8);
  for (let i = 0; i < 4; i++) {
    data[i*2]   = mins[i] & 0xFF;
    data[i*2+1] = maxs[i] & 0xFF;
  }

  try {
    await configCharacteristic.writeValue(data.buffer);
  } catch (e) {
    console.error("Error writing config:", e);
  }
};
</script>

</body>
</html>

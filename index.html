<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ESP32 4‑Channel BLE Dashboard</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    input[type=range] { width: 300px; }
    h3 { margin-bottom: 5px; }
    .channel { margin-bottom: 15px; }
  </style>
</head>

<body>
  <h1>ESP32 4‑Channel BLE Dashboard</h1>

  <button id="connectButton">Connect</button>
  <p id="status">Status: Not connected</p>

  <h2>Current Brightness</h2>
  <p>CH1: <span id="b1">---</span></p>
  <p>CH2: <span id="b2">---</span></p>
  <p>CH3: <span id="b3">---</span></p>
  <p>CH4: <span id="b4">---</span></p>

  <h2>Configuration</h2>

  <div class="channel">
    <h3>Channel 1</h3>
    Min: <input type="range" id="min1" min="0" max="255" value="0"> <span id="min1v">0</span><br>
    Max: <input type="range" id="max1" min="0" max="255" value="255"> <span id="max1v">255</span><br>
    Fade: <input type="range" id="fade1" min="1" max="20" value="5"> <span id="fade1v">5</span>
  </div>

  <div class="channel">
    <h3>Channel 2</h3>
    Min: <input type="range" id="min2" min="0" max="255" value="0"> <span id="min2v">0</span><br>
    Max: <input type="range" id="max2" min="0" max="255" value="255"> <span id="max2v">255</span><br>
    Fade: <input type="range" id="fade2" min="1" max="20" value="5"> <span id="fade2v">5</span>
  </div>

  <div class="channel">
    <h3>Channel 3</h3>
    Min: <input type="range" id="min3" min="0" max="255" value="0"> <span id="min3v">0</span><br>
    Max: <input type="range" id="max3" min="0" max="255" value="255"> <span id="max3v">255</span><br>
    Fade: <input type="range" id="fade3" min="1" max="20" value="5"> <span id="fade3v">5</span>
  </div>

  <div class="channel">
    <h3>Channel 4</h3>
    Min: <input type="range" id="min4" min="0" max="255" value="0"> <span id="min4v">0</span><br>
    Max: <input type="range" id="max4" min="0" max="255" value="255"> <span id="max4v">255</span><br>
    Fade: <input type="range" id="fade4" min="1" max="20" value="5"> <span id="fade4v">5</span>
  </div>

  <button id="saveConfigButton">Save All</button>

<script>
const SERVICE_UUID               = "19b10000-e8f2-537e-4f6c-d104768a1214";
const SENSOR_CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
const CONFIG_CHARACTERISTIC_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";
const SYNC_CHARACTERISTIC_UUID   = "19b10003-e8f2-537e-4f6c-d104768a1214";

let sensorCharacteristic = null;
let configCharacteristic = null;
let syncCharacteristic   = null;

// Slider label updates
function bindSlider(slider, label) {
  slider.addEventListener("input", () => label.innerHTML = slider.value);
}

bindSlider(min1, min1v);
bindSlider(max1, max1v);
bindSlider(fade1, fade1v);

bindSlider(min2, min2v);
bindSlider(max2, max2v);
bindSlider(fade2, fade2v);

bindSlider(min3, min3v);
bindSlider(max3, max3v);
bindSlider(fade3, fade3v);

bindSlider(min4, min4v);
bindSlider(max4, max4v);
bindSlider(fade4, fade4v);

// Connect to ESP32
document.getElementById("connectButton").onclick = async () => {
  try {
    document.getElementById("status").innerHTML = "Status: Requesting device...";

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ESP32" }],
      optionalServices: [SERVICE_UUID]
    });

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    sensorCharacteristic = await service.getCharacteristic(SENSOR_CHARACTERISTIC_UUID);
    configCharacteristic = await service.getCharacteristic(CONFIG_CHARACTERISTIC_UUID);
    syncCharacteristic   = await service.getCharacteristic(SYNC_CHARACTERISTIC_UUID);

    // Sync min/max/fade from ESP32
    const syncData = await syncCharacteristic.readValue();
    const arr = new Uint8Array(syncData.buffer);

    min1.value = arr[0]; max1.value = arr[1]; fade1.value = arr[2];
    min2.value = arr[3]; max2.value = arr[4]; fade2.value = arr[5];
    min3.value = arr[6]; max3.value = arr[7]; fade3.value = arr[8];
    min4.value = arr[9]; max4.value = arr[10]; fade4.value = arr[11];

    min1v.innerHTML = min1.value;
    max1v.innerHTML = max1.value;
    fade1v.innerHTML = fade1.value;

    min2v.innerHTML = min2.value;
    max2v.innerHTML = max2.value;
    fade2v.innerHTML = fade2.value;

    min3v.innerHTML = min3.value;
    max3v.innerHTML = max3.value;
    fade3v.innerHTML = fade3.value;

    min4v.innerHTML = min4.value;
    max4v.innerHTML = max4.value;
    fade4v.innerHTML = fade4.value;

    // Subscribe to brightness notifications
    await sensorCharacteristic.startNotifications();
    sensorCharacteristic.addEventListener("characteristicvaluechanged", event => {
      let txt   = new TextDecoder().decode(event.target.value);
      let parts = txt.split(",");
      if (parts.length >= 4) {
        b1.innerHTML = parts[0];
        b2.innerHTML = parts[1];
        b3.innerHTML = parts[2];
        b4.innerHTML = parts[3];
      }
    });

    document.getElementById("status").innerHTML = "Status: Connected";
  } catch (e) {
    console.error(e);
    document.getElementById("status").innerHTML = "Status: Error connecting";
  }
};

// Send min/max/fade for all 4 channels
document.getElementById("saveConfigButton").onclick = async () => {
  if (!configCharacteristic) {
    alert("Not connected to ESP32");
    return;
  }

  const data = new Uint8Array(12);

  data[0] = min1.value; data[1] = max1.value; data[2] = fade1.value;
  data[3] = min2.value; data[4] = max2.value; data[5] = fade2.value;
  data[6] = min3.value; data[7] = max3.value; data[8] = fade3.value;
  data[9] = min4.value; data[10] = max4.value; data[11] = fade4.value;

  try {
    await configCharacteristic.writeValue(data.buffer);
  } catch (e) {
    console.error("Error writing config:", e);
  }
};
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ESP32 4‑Channel BLE Dashboard</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    input[type=range] { width: 300px; }
    h3 { margin-bottom: 5px; }
    .channel { margin-bottom: 15px; }
  </style>
</head>

<body>
  <h1>ESP32 4‑Channel BLE Dashboard (Real‑Time)</h1>

  <button id="connectButton">Connect</button>
  <p id="status">Status: Not connected</p>

  <h2>Current Brightness</h2>
  <p>CH1: <span id="b1">---</span></p>
  <p>CH2: <span id="b2">---</span></p>
  <p>CH3: <span id="b3">---</span></p>
  <p>CH4: <span id="b4">---</span></p>

  <h2>Configuration</h2>

  <div class="channel">
    <h3>Channel 1</h3>
    Min: <input type="range" id="min1" min="0" max="255"><span id="min1v"></span><br>
    Max: <input type="range" id="max1" min="0" max="255"><span id="max1v"></span><br>
    Fade: <input type="range" id="fade1" min="1" max="20"><span id="fade1v"></span><br>
    Brightness: <input type="range" id="b1s" min="0" max="255"><span id="b1sv"></span>
  </div>

  <div class="channel">
    <h3>Channel 2</h3>
    Min: <input type="range" id="min2" min="0" max="255"><span id="min2v"></span><br>
    Max: <input type="range" id="max2" min="0" max="255"><span id="max2v"></span><br>
    Fade: <input type="range" id="fade2" min="1" max="20"><span id="fade2v"></span><br>
    Brightness: <input type="range" id="b2s" min="0" max="255"><span id="b2sv"></span>
  </div>

  <div class="channel">
    <h3>Channel 3</h3>
    Min: <input type="range" id="min3" min="0" max="255"><span id="min3v"></span><br>
    Max: <input type="range" id="max3" min="0" max="255"><span id="max3v"></span><br>
    Fade: <input type="range" id="fade3" min="1" max="20"><span id="fade3v"></span><br>
    Brightness: <input type="range" id="b3s" min="0" max="255"><span id="b3sv"></span>
  </div>

  <div class="channel">
    <h3>Channel 4</h3>
    Min: <input type="range" id="min4" min="0" max="255"><span id="min4v"></span><br>
    Max: <input type="range" id="max4" min="0" max="255"><span id="max4v"></span><br>
    Fade: <input type="range" id="fade4" min="1" max="20"><span id="fade4v"></span><br>
    Brightness: <input type="range" id="b4s" min="0" max="255"><span id="b4sv"></span>
  </div>

<script>
const SERVICE_UUID               = "19b10000-e8f2-537e-4f6c-d104768a1214";
const SENSOR_CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
const CONFIG_CHARACTERISTIC_UUID = "19b10002-e8f2-537e-4f6c-d104768a1214";
const SYNC_CHARACTERISTIC_UUID   = "19b10003-e8f2-537e-4f6c-d104768a1214";
const LIVE_BRIGHTNESS_UUID       = "19b10004-e8f2-537e-4f6c-d104768a1214";
const LIVE_FADE_UUID             = "19b10005-e8f2-537e-4f6c-d104768a1214";

let sensorCharacteristic = null;
let configCharacteristic = null;
let syncCharacteristic   = null;
let liveBrightness       = null;
let liveFade             = null;

function bindSlider(slider, label, callback) {
  slider.addEventListener("input", () => {
    label.innerHTML = slider.value;
    if (callback) callback();
  });
}

document.getElementById("connectButton").onclick = async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ESP32" }],
      optionalServices: [SERVICE_UUID]
    });

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    sensorCharacteristic = await service.getCharacteristic(SENSOR_CHARACTERISTIC_UUID);
    configCharacteristic = await service.getCharacteristic(CONFIG_CHARACTERISTIC_UUID);
    syncCharacteristic   = await service.getCharacteristic(SYNC_CHARACTERISTIC_UUID);
    liveBrightness       = await service.getCharacteristic(LIVE_BRIGHTNESS_UUID);
    liveFade             = await service.getCharacteristic(LIVE_FADE_UUID);

    // Sync values
    const syncData = await syncCharacteristic.readValue();
    const arr = new Uint8Array(syncData.buffer);

    const mins  = [min1, min2, min3, min4];
    const maxs  = [max1, max2, max3, max4];
    const fades = [fade1, fade2, fade3, fade4];

    for (let i = 0; i < 4; i++) {
      mins[i].value  = arr[i*3];
      maxs[i].value  = arr[i*3+1];
      fades[i].value = arr[i*3+2];
    }

    // Update labels
    min1v.innerHTML = min1.value;
    max1v.innerHTML = max1.value;
    fade1v.innerHTML = fade1.value;

    min2v.innerHTML = min2.value;
    max2v.innerHTML = max2.value;
    fade2v.innerHTML = fade2.value;

    min3v.innerHTML = min3.value;
    max3v.innerHTML = max3.value;
    fade3v.innerHTML = fade3.value;

    min4v.innerHTML = min4.value;
    max4v.innerHTML = max4.value;
    fade4v.innerHTML = fade4.value;

    // Subscribe to brightness notifications
    await sensorCharacteristic.startNotifications();
    sensorCharacteristic.addEventListener("characteristicvaluechanged", event => {
      let txt   = new TextDecoder().decode(event.target.value);
      let parts = txt.split(",");
      b1.innerHTML = parts[0];
      b2.innerHTML = parts[1];
      b3.innerHTML = parts[2];
      b4.innerHTML = parts[3];
    });

    document.getElementById("status").innerHTML = "Connected";
  } catch (e) {
    console.error(e);
    document.getElementById("status").innerHTML = "Error";
  }
};

// Real-time brightness
function sendBrightness() {
  const data = new Uint8Array([
    b1s.value,
    b2s.value,
    b3s.value,
    b4s.value
  ]);
  liveBrightness.writeValue(data);
}

// Real-time fade speed
function sendFade() {
  const data = new Uint8Array([
    fade1.value,
    fade2.value,
    fade3.value,
    fade4.value
  ]);
